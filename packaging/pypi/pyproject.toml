[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klaridian"
version = "0.0.1"
description = "Generate MCP servers from an OpenAPI spec, with observability and tool curation — native binary, no Node required."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Ricardo Vasconcelos" }]
keywords = ["mcp", "openapi", "model-context-protocol", "codegen", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://klaridian.dev"
Repository = "https://github.com/ricardocvasconcelos/klaridian"

# The console script points at the shim, which execs the embedded binary.
[project.scripts]
klaridian = "klaridian.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/klaridian"]
# The binary is force-included by the build hook (it isn't in the source tree
# at author time — CI drops it in per platform).
artifacts = ["src/klaridian/_binary/*"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# No sdist: an sdist implies "build from source", but there is no Python source
# to build — the artifact is a per-platform prebuilt binary. Shipping only
# wheels is correct here (same as ruff/uv's binary wheels).
[tool.hatch.build.targets.sdist]
exclude = ["*"]
