name: Release

# Fires only on a pushed version tag (vX.Y.Z), never on a normal push to
# main — a tag is the explicit "this is a release" signal (CONTRIBUTING
# §Releases). The flow: gate on the real CI, then publish the npm CLI and
# the PyPI middleware via OIDC Trusted Publishing (no stored tokens), then
# cut a GitHub Release from the tag.
on:
  push:
    tags:
      - "v*"

# Least-privilege by default; each job widens only what it needs.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate: the tag's version must match what's in the manifests, and the full
  # existing test suite must pass, BEFORE anything is published. A mismatch
  # (tag v0.2.0 but package.json still 0.1.0) fails loudly here rather than
  # shipping a mislabeled artifact.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify tag + tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Tag matches packages/cli/package.json
        run: |
          PKG=$(node -p "require('./packages/cli/package.json').version")
          if [ "$PKG" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.tag.outputs.version }} != packages/cli/package.json $PKG"
            exit 1
          fi

      - name: Tag matches packages/python-posthog-middleware/pyproject.toml
        run: |
          PY=$(grep -E '^version = ' packages/python-posthog-middleware/pyproject.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          if [ "$PY" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.tag.outputs.version }} != pyproject.toml $PY"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: CLI build + E2E tests
        working-directory: packages/cli
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Python middleware tests
        working-directory: packages/python-posthog-middleware
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/

  # ---------------------------------------------------------------------------
  # npm publish via OIDC Trusted Publishing. No NODE_AUTH_TOKEN: the registry
  # is registered to trust this repo + workflow, and provenance is attached
  # from the id-token. Requires npm CLI >= 11.5.1 (installed explicitly).
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish CLI to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (Trusted Publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - name: Install + build
        working-directory: packages/cli
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish (OIDC, provenance)
        working-directory: packages/cli
        run: npm publish --access public

  # ---------------------------------------------------------------------------
  # PyPI publish via OIDC Trusted Publishing (pypa/gh-action-pypi-publish).
  # No API token: PyPI is configured to trust this repo + workflow + env.
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish middleware to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        working-directory: packages/python-posthog-middleware
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-posthog-middleware/dist

  # ---------------------------------------------------------------------------
  # GitHub Release from the tag, with auto-generated notes. Runs only after
  # both publishes succeed so the release never points at a version that
  # failed to ship.
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: [publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
