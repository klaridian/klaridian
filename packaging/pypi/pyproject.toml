[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "klaridian"
version = "0.3.0"
description = "Generate MCP servers in Python or TypeScript from an OpenAPI spec, with observability and tool curation. Native binary, no Node.js required."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"  # PEP 639 SPDX expression (needs hatchling>=1.27)
authors = [{ name = "Ricardo Vasconcelos" }]
keywords = ["mcp", "mcp-server", "model-context-protocol", "openapi", "swagger", "code-generator", "codegen", "observability", "opentelemetry", "posthog", "amplitude", "mixpanel", "python", "typescript", "ai-agents", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: JavaScript",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://klaridian.dev"
Documentation = "https://klaridian.dev/docs"
Repository = "https://github.com/klaridian/klaridian"
Changelog = "https://github.com/klaridian/klaridian/blob/main/CHANGELOG.md"
Issues = "https://github.com/klaridian/klaridian/issues"

# The console script points at the shim, which execs the embedded binary.
[project.scripts]
klaridian = "klaridian.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/klaridian"]
# The binary is force-included by the build hook (it isn't in the source tree
# at author time — CI drops it in per platform).
artifacts = ["src/klaridian/_binary/*"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# No sdist: an sdist implies "build from source", but there is no Python source
# to build — the artifact is a per-platform prebuilt binary. Shipping only
# wheels is correct here (same as ruff/uv's binary wheels).
[tool.hatch.build.targets.sdist]
exclude = ["*"]
