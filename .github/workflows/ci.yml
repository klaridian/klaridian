name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cli:
    name: CLI (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Deno (MCPFO-30 -- execute_code sandbox E2E tests spawn a real deno subprocess)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install
        run: npm install --no-audit --no-fund
      - name: "Build + test (real E2E: npm install/build/run a generated server)"
        run: npm test

  python-posthog-middleware:
    name: Python PostHog middleware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python-posthog-middleware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest tests/
