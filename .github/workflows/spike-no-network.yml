# SPIKE (temporary) — validate a no-network sandbox on the CI runner before
# wiring the real "no phone-home" proof job. Deleted before the PR merges.
name: spike-no-network

on:
  push:
    branches: [feat/verifiable-no-phone-home]

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build CLI
        working-directory: packages/cli
        run: |
          npm ci
          npm run build

      - name: Sanity — control run WITH network resolves a public host
        run: |
          getent hosts registry.npmjs.org && echo "CONTROL: DNS works with network (expected)"

      - name: Mechanism 1 — sudo unshare -n (network namespace, no net)
        id: unshare
        continue-on-error: true
        run: |
          set -x
          # Prove the sandbox truly has no network: a DNS/connect MUST fail inside it.
          if sudo unshare -n bash -c 'getent hosts registry.npmjs.org'; then
            echo "UNSHARE: host resolved inside netns — sandbox NOT isolating (BAD)"
            exit 1
          else
            echo "UNSHARE: DNS fails inside netns (GOOD — no network)"
          fi
          # Now the real thing: generate offline from a LOCAL spec inside the netns.
          sudo unshare -n bash -c '
            node packages/cli/dist/src/index.js generate \
              --spec examples/petstore/openapi.json \
              --out /tmp/spike-ts --name spike \
              --base-url https://petstore3.swagger.io/api/v3
          '
          test -f /tmp/spike-ts/src/index.ts && echo "UNSHARE: generated offline OK"

      - name: Mechanism 2 — docker run --network none
        id: docker
        continue-on-error: true
        run: |
          set -x
          docker run --rm --network none -v "$PWD":/w -w /w node:22-slim bash -c '
            if getent hosts registry.npmjs.org; then echo "DOCKER: resolved (BAD)"; exit 1; fi
            echo "DOCKER: DNS fails (GOOD)"
            node packages/cli/dist/src/index.js generate \
              --spec examples/petstore/openapi.json \
              --out /tmp/spike-docker --name spike \
              --base-url https://petstore3.swagger.io/api/v3
            test -f /tmp/spike-docker/src/index.ts && echo "DOCKER: generated offline OK"
          '

      - name: Report which mechanisms worked
        run: |
          echo "unshare outcome: ${{ steps.unshare.outcome }}"
          echo "docker outcome:  ${{ steps.docker.outcome }}"
