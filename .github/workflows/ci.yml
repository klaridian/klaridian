name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Detect WHAT changed so a docs-only change doesn't pay for the heavy E2E
  # suite and the Python middleware pytest run (which build/install/spawn real
  # servers). A commit that only touches prose, the landing page, or the docs
  # site has nothing those jobs can regress -- and the release workflow is
  # tag-only, so nothing is rebuilt or republished on a docs push regardless
  # (ARCHITECTURE.md §69). Vale (docs-style) still runs on docs changes; the
  # generated cli-reference gate (docs-flags-sync) still runs when CLI code
  # changes. .github/workflows/ci.yml is included in each code filter so a
  # change to CI itself always re-exercises the full suite.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'packages/cli/**'
              - '.github/workflows/ci.yml'

  cli:
    # Two legs: the supported FLOOR and the newest line for each runtime a
    # generated server targets (src/emit/runtime-versions.ts, MCPFO-121). A
    # floor that CI never runs is an untested promise; runtime-versions.test.ts
    # fails if this matrix stops including the declared floors.
    name: CLI (Node ${{ matrix.node }}, Python ${{ matrix.python }})
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22"
            python: "3.11"
          - node: "24"
            python: "3.13"
    env:
      KLARIDIAN_TEST_PYTHON: python
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Python (MCPFO-60.3 -- emit-python-e2e tests pip-install + spawn a generated Python MCP server)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Deno (MCPFO-30 -- execute_code sandbox E2E tests spawn a real deno subprocess)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install
        run: npm install --no-audit --no-fund
      - name: "Build + test (real E2E: npm install/build/run a generated server)"
        run: npm test

  docs-style:
    name: Documentation style (Vale, non-blocking)
    runs-on: ubuntu-latest
    # Reports Microsoft Writing Style Guide violations (STYLE.md) as an
    # annotated check without failing the build -- author/reviewer
    # discipline for now, not yet a hard gate. Flip continue-on-error to
    # false once the backlog of any newly-introduced violations is clean
    # on a few consecutive PRs. Runs unconditionally: prose lives across
    # the repo, so a docs-only change is exactly when this matters most.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Vale
        run: |
          curl -sfLo vale.tar.gz \
            https://github.com/errata-ai/vale/releases/download/v3.20.0/vale_3.20.0_Linux_64-bit.tar.gz
          tar -xzf vale.tar.gz vale
          sudo mv vale /usr/local/bin/vale
          rm vale.tar.gz
          vale --version
      - name: Sync Vale styles (downloads the MIT-licensed Microsoft package)
        run: vale sync
      - name: Run Vale (Microsoft Writing Style Guide)
        env:
          # Vale resolves the custom vocabulary (Vocab=klaridian in .vale.ini)
          # against this path, not .vale.ini's project-relative StylesPath --
          # without it Vale looks under the global per-user config dir instead
          # and fails with "vocabulary not found" in a fresh CI runner.
          VALE_STYLES_PATH: ${{ github.workspace }}/.github/vale/styles
        run: |
          vale README.md AGENTS.md PLAN.md ARCHITECTURE.md CONTRIBUTING.md \
            SECURITY.md CODE_OF_CONDUCT.md STYLE.md packages/site/content/docs
        continue-on-error: true

  docs-flags-sync:
    name: CLI flags <-> docs sync (blocking)
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    # BLOCKING, unlike docs-style above: packages/site/content/docs/cli-reference.mdx
    # is generated from the live `klaridian generate` Command
    # (packages/cli/scripts/generate-cli-docs.mjs), not hand-written. This
    # job regenerates it from the current code and fails the build if the
    # committed file doesn't match -- the exact drift (documented flags
    # that don't exist, real flags never documented) that motivated
    # building this generator in the first place. Fix locally with
    # `npm run docs:gen` (packages/cli) and commit the result. Gated on the
    # cli filter: the generated file can only drift when CLI code changes.
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Regenerate CLI reference and diff against the committed file
        run: npm run docs:check

  no-phone-home:
    name: No phone-home (offline generate proof)
    needs: changes
    if: ${{ needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    # MCPFO-43: proves the "zero telemetry, ever" promise is REAL, not just
    # stated. Runs `klaridian generate` from a LOCAL spec inside a network
    # namespace with NO connectivity (sudo unshare -n) and asserts a server is
    # still produced. If the generator phoned home (telemetry / update check /
    # analytics beacon), an air-gapped generate would fail here. The same script
    # is committed at scripts/verify-no-phone-home.sh so any user can reproduce
    # this on their own machine -- the verification method is the trust pitch
    # (README "No phone-home, and here's the proof"), not a claim to take on
    # faith. Gated on the cli filter: only CLI code can change this behavior.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build CLI
        working-directory: packages/cli
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify the generator makes zero unsolicited network calls
        run: bash scripts/verify-no-phone-home.sh
