<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0ea5b7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="400" rx="16" fill="#020617"/>
  <rect x="0" y="0" width="1200" height="400" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="398" rx="15" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <circle cx="46" cy="52" r="6" fill="#22d3ee"/>
  <text x="64" y="60" fill="white" font-size="34" font-weight="700" letter-spacing="-0.5">klaridian</text>
  <text x="46" y="90" fill="#94a3b8" font-size="14">Generate MCP servers with observability + tool curation built in</text>

  <!-- Pipeline: OpenAPI Spec -->
  <rect x="46" y="200" width="160" height="72" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="126" y="232" fill="white" font-size="13" font-weight="600" text-anchor="middle">OpenAPI Spec</text>
  <text x="126" y="250" fill="#94a3b8" font-size="10" text-anchor="middle">your existing API</text>

  <!-- Arrow 1 -->
  <line x1="206" y1="236" x2="278" y2="236" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Pipeline: klaridian (brand node) -->
  <rect x="280" y="176" width="220" height="120" rx="10" fill="rgba(8, 66, 78, 0.45)" stroke="url(#brandGrad)" stroke-width="2"/>
  <text x="390" y="216" fill="white" font-size="17" font-weight="700" text-anchor="middle">klaridian</text>
  <text x="390" y="240" fill="#67e8f9" font-size="9" text-anchor="middle">generate --plugin otel</text>
  <text x="390" y="254" fill="#67e8f9" font-size="9" text-anchor="middle">--plugin posthog</text>
  <text x="390" y="276" fill="#94a3b8" font-size="9" text-anchor="middle">curate tools • instrument • ship</text>

  <!-- Arrow 2 -->
  <line x1="500" y1="236" x2="572" y2="236" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Pipeline: MCP Server -->
  <rect x="574" y="200" width="180" height="72" rx="8" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="664" y="228" fill="white" font-size="13" font-weight="600" text-anchor="middle">MCP Server</text>
  <text x="664" y="246" fill="#94a3b8" font-size="10" text-anchor="middle">runnable, instrumented</text>
  <text x="664" y="260" fill="#94a3b8" font-size="10" text-anchor="middle">TypeScript or Python</text>

  <!-- Branch lines to category groups -->
  <path d="M 754 224 L 774 224 L 774 78 L 794 78" fill="none" stroke="#fbbf24" stroke-width="1.3"/>
  <path d="M 754 248 L 774 248 L 774 246 L 794 246" fill="none" stroke="#a78bfa" stroke-width="1.3"/>

  <!-- Engineering observability group (amber) -->
  <text x="794" y="58" fill="#fbbf24" font-size="10" font-weight="700">Engineering observability</text>
  <text x="794" y="70" fill="#64748b" font-size="8">via OpenTelemetry / OTLP — any compatible backend</text>
  <rect x="794" y="80" width="110" height="30" rx="15" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="849" y="99" fill="white" font-size="10" font-weight="600" text-anchor="middle">Datadog</text>
  <rect x="912" y="80" width="110" height="30" rx="15" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="967" y="99" fill="white" font-size="10" font-weight="600" text-anchor="middle">Grafana</text>
  <rect x="1030" y="80" width="132" height="30" rx="15" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="1096" y="99" fill="white" font-size="10" font-weight="600" text-anchor="middle">Honeycomb</text>
  <rect x="794" y="118" width="110" height="30" rx="15" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="849" y="137" fill="white" font-size="10" font-weight="600" text-anchor="middle">New Relic</text>
  <rect x="912" y="118" width="250" height="30" rx="15" fill="rgba(120, 53, 15, 0.18)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="1037" y="137" fill="#cbb26a" font-size="9" text-anchor="middle">+ any OTLP-compatible backend</text>

  <!-- Product analytics group (violet) -->
  <text x="794" y="178" fill="#a78bfa" font-size="10" font-weight="700">Product analytics</text>
  <text x="794" y="190" fill="#64748b" font-size="8">via dedicated per-provider plugins (no shared standard)</text>
  <rect x="794" y="200" width="110" height="30" rx="15" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="849" y="219" fill="white" font-size="10" font-weight="600" text-anchor="middle">PostHog</text>
  <rect x="912" y="200" width="110" height="30" rx="15" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="967" y="219" fill="white" font-size="10" font-weight="600" text-anchor="middle">Amplitude</text>
  <rect x="1030" y="200" width="132" height="30" rx="15" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="1096" y="219" fill="white" font-size="10" font-weight="600" text-anchor="middle">Mixpanel</text>

  <!-- Tool curation chip (rose), standalone concern (not a fan-out list) -->
  <path d="M 754 236 L 774 236 L 774 275 L 794 275" fill="none" stroke="#fb7185" stroke-width="1.3"/>
  <rect x="794" y="260" width="150" height="30" rx="15" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.3"/>
  <text x="869" y="279" fill="white" font-size="10" font-weight="600" text-anchor="middle">Tool Curation</text>

  <!-- Footer -->
  <text x="46" y="368" fill="#475569" font-size="11">OpenAPI → MCP (TypeScript or Python), instrumented automatically</text>
  <text x="1154" y="368" fill="#475569" font-size="11" text-anchor="end">MIT</text>
</svg>
