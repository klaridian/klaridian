[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klaridian-posthog-middleware"
version = "0.1.0"
description = "FastMCP middleware: PostHog product-observability event per tool call. The Python counterpart to klaridian's TypeScript posthog plugin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ricardo Vasconcelos" }]
keywords = ["mcp", "model-context-protocol", "fastmcp", "posthog", "observability", "product-analytics", "middleware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastmcp>=4.0.0,<5.0.0",
    "posthog>=3.0.0,<4.0.0",
]

[project.urls]
Homepage = "https://klaridian.dev"
Repository = "https://github.com/klaridian/klaridian"
Issues = "https://github.com/klaridian/klaridian/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/klaridian_posthog_middleware"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

