# EMITTED ARTIFACT (spike): what `klaridian deploy --target fly` would write.
# Container app on Fly Machines. app name is a placeholder the CLI would set
# (or prompt) — `fly config validate` checks structure, not name availability.
app = "klaridian-deploy-demo"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[env]
  KLARIDIAN_BIND_HOST = "0.0.0.0"
  KLARIDIAN_BASE_URL = "https://petstore3.swagger.io/api/v3"
  # KLARIDIAN_ALLOWED_HOSTS is set at deploy time to "<app>.fly.dev" so the
  # server's Host-header validation accepts the public hostname (see FINDINGS).

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
