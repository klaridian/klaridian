name: Release

# Fires only on a pushed version tag (vX.Y.Z), never on a normal push to
# main — a tag is the explicit "this is a release" signal (CONTRIBUTING
# §Releases). The flow: gate on the real CI, then publish the npm CLI via
# OIDC Trusted Publishing (no stored tokens), then cut a GitHub Release.
#
# npm-only by design: the klaridian CLI is the published artifact. The Python
# side of klaridian is the `--language python` generator target (which emits a
# project built on the OFFICIAL mcp SDK and ships INSIDE this CLI), not a
# separate PyPI package — packages/python-posthog-middleware is a FastMCP
# add-on that is deliberately NOT published (see ARCHITECTURE.md §23 and the
# Sep 2026 decision to keep klaridian on the official SDK, not FastMCP).
on:
  push:
    tags:
      - "v*"

# Least-privilege by default; each job widens only what it needs.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gate: the tag's version must match packages/cli/package.json, and the full
  # existing test suite must pass, BEFORE publishing. A mismatch (tag v0.2.0
  # but package.json still 0.1.0) fails loudly here rather than shipping a
  # mislabeled artifact.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify tag + tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Tag matches packages/cli/package.json
        run: |
          PKG=$(node -p "require('./packages/cli/package.json').version")
          if [ "$PKG" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.tag.outputs.version }} != packages/cli/package.json $PKG"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: CLI build + E2E tests
        working-directory: packages/cli
        run: |
          npm install --no-audit --no-fund
          npm test

  # ---------------------------------------------------------------------------
  # npm publish via OIDC Trusted Publishing. No NODE_AUTH_TOKEN: the registry
  # is registered to trust this repo + workflow, and provenance is attached
  # from the id-token. Requires npm CLI >= 11.5.1 (installed explicitly).
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish CLI to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (Trusted Publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - name: Install + build
        working-directory: packages/cli
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish (OIDC, provenance)
        working-directory: packages/cli
        run: npm publish --access public

  # ---------------------------------------------------------------------------
  # GitHub Release from the tag, with auto-generated notes. Runs only after
  # the publish succeeds so the release never points at a version that failed
  # to ship.
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
