[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klaridian-posthog-middleware"
version = "0.1.0"
description = "FastMCP middleware: PostHog product-observability event per tool call. The Python counterpart to klaridian's TypeScript posthog plugin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ricardo Vasconcelos" }]
dependencies = [
    "fastmcp>=4.0.0,<5.0.0",
    "posthog>=3.0.0,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/ricardocvasconcelos/klaridian"
Repository = "https://github.com/ricardocvasconcelos/klaridian"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/klaridian_posthog_middleware"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

